name: DSA CI

on:
  pull_request:
  push:
    branches:
      - baseline/dsa-20261118

permissions:
  contents: read

concurrency:
  group: dsa-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      DEV_MODE: production
      NEXT_PUBLIC_DEV_MODE: production
      NEXT_PUBLIC_API_URL: http://127.0.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  python-guards:
    name: Python production guards
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/python_engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run table-mode regression tests
        run: python -m unittest tests.test_dsa_table_mode

  laravel-guards:
    name: Laravel production guards
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install Composer dependencies from a clean vendor directory
        run: |
          rm -rf vendor
          composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Verify data commands are registered
        run: |
          php artisan list --raw | grep -q '^data:periods '
          php artisan list --raw | grep -q '^data:coverage '

      - name: Run DSA production guard tests
        run: |
          php artisan test --filter DsaTablesTest
          php artisan test --filter SnapshotServiceUuidTest

name: DSA CI

on:
  pull_request:
  push:
    branches:
      - baseline/dsa-20261118

permissions:
  contents: read

concurrency:
  group: dsa-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      DEV_MODE: production
      NEXT_PUBLIC_DEV_MODE: production
      NEXT_PUBLIC_API_URL: http://127.0.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify frontend runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Report frontend dev/tooling advisories
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Verify Market View frontend contract
        run: node scripts/verify-market-board-contract.mjs

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  python-guards:
    name: Python production guards
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/python_engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile production data/realtime modules
        run: |
          python -m py_compile \
            app/analyze/dashboard/dashboard.py \
            app/bootstrap/scheduler_config.py \
            app/bootstrap/scheduler_runtime.py \
            app/jobs/analysis_job.py \
            app/data_collect/history_policy.py \
            app/data_collect/collectors/stock_sync.py \
            app/data_collect/symbol_ingest.py \
            app/jobs/stock_job.py \
            app/socket/events.py \
            app/warm_up/warm_up.py \
            snapshot_build.py

      - name: Verify 40-symbol runtime contract
        run: |
          grep -q 'SYMBOL_INGEST_TOP_N=40' ../../docker-compose.yml
          grep -q 'MARKET_BOARD_SYMBOL_LIMIT=40' ../../docker-compose.yml
          grep -q 'HISTORY_BOOTSTRAP_MIN_BARS=180' ../../docker-compose.yml
          grep -q 'HISTORY_BOOTSTRAP_DAYS=3650' ../../docker-compose.yml
          grep -q 'DASHBOARD_WARM_UP_LIMIT=40' ../../docker-compose.yml
          grep -q 'DASHBOARD_WARM_UP_CHART_BARS=90' ../../docker-compose.yml
          grep -q 'ENGINE_RESOURCE_PROFILE=pi4' ../../docker-compose.yml
          grep -q 'SCHEDULER_MAX_WORKERS=1' ../../docker-compose.yml
          grep -q 'AUTO_ANALYZE_CONCURRENCY=2' ../../docker-compose.yml
          grep -q 'SYMBOL_INGEST_TOP_N.*"40"' app/bootstrap/scheduler_config.py
          grep -q 'DASHBOARD_WARM_UP_LIMIT.*"40"' app/bootstrap/scheduler_config.py
          grep -q 'COUNT(DISTINCT DATE(timestamps))' app/data_collect/collectors/stock_sync.py
          grep -q 'persisted_daily = self.persisted_daily_frame' app/data_collect/collectors/stock_sync.py

      - name: Verify Raspberry Pi 4GB scheduler profile
        run: |
          ENGINE_RESOURCE_PROFILE=pi4 \
          python - <<'PY'
          from app.bootstrap.scheduler_config import (
              AUTO_ANALYZE_CONCURRENCY,
              AUTO_ANALYZE_SCHEDULE_LIMIT,
              AUTO_ANALYZE_STARTUP_WARMUP_ENABLED,
              SCHEDULER_MAX_WORKERS,
              TECH_UNIVERSE_BOOTSTRAP_DELAY_SEC,
          )

          assert SCHEDULER_MAX_WORKERS == 1
          assert AUTO_ANALYZE_CONCURRENCY == 2
          assert AUTO_ANALYZE_SCHEDULE_LIMIT == 40
          assert AUTO_ANALYZE_STARTUP_WARMUP_ENABLED is False
          assert TECH_UNIVERSE_BOOTSTRAP_DELAY_SEC >= 1800
          PY

      - name: Run table-mode regression tests
        run: python -m unittest tests.test_dsa_table_mode tests.test_history_policy

  laravel-guards:
    name: Laravel production guards
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install Composer dependencies from a clean vendor directory
        run: |
          rm -rf vendor
          composer install --no-interaction --prefer-dist --no-progress

      - name: Verify Composer production dependencies
        run: composer audit --locked --no-dev

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Verify data commands are registered
        run: |
          php artisan list --raw | grep -q '^data:periods '
          php artisan list --raw | grep -q '^data:coverage '

      - name: Verify Pi audit script syntax
        run: |
          bash -n ../scripts/pi-history-audit.sh
          bash -n ../scripts/pi-source-parity.sh
          bash -n ../scripts/pi-backend-deploy.sh


      - name: Run DSA production guard tests
        run: |
          php artisan test --filter DsaTablesTest
          php artisan test --filter SnapshotServiceUuidTest

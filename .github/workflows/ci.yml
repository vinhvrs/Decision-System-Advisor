name: DSA CI

on:
  pull_request:
  push:
    branches:
      - baseline/dsa-20261118

permissions:
  contents: read

concurrency:
  group: dsa-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      DEV_MODE: production
      NEXT_PUBLIC_DEV_MODE: production
      NEXT_PUBLIC_API_URL: http://127.0.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Report frontend dependency advisories
        continue-on-error: true
        run: npm audit --audit-level=critical

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  dependency-lock-refresh:
    name: Security lockfile proposal
    if: github.event_name == 'pull_request' && github.head_ref == 'work/p0-dependency-security-20261118'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Resolve npm security updates within declared ranges
        working-directory: frontend
        run: npm audit fix --package-lock-only || true

      - name: Resolve targeted Composer security updates
        working-directory: backend
        run: >
          composer update
          laravel/framework
          guzzlehttp/guzzle
          guzzlehttp/psr7
          league/commonmark
          league/flysystem
          paragonie/sodium_compat
          symfony/http-foundation
          symfony/http-kernel
          symfony/mailer
          symfony/mime
          symfony/polyfill-intl-idn
          symfony/routing
          --with-all-dependencies
          --no-install
          --no-scripts
          --no-interaction
          --no-progress

      - name: Show proposed lockfile diff
        run: |
          git diff --stat -- frontend/package-lock.json backend/composer.lock
          git diff -- frontend/package.json backend/composer.json

      - name: Upload proposed lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: security-lockfiles
          path: |
            frontend/package-lock.json
            backend/composer.lock
          if-no-files-found: error
          retention-days: 3

  python-guards:
    name: Python production guards
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/python_engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run table-mode regression tests
        run: python -m unittest tests.test_dsa_table_mode

  laravel-guards:
    name: Laravel production guards
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install Composer dependencies from a clean vendor directory
        run: |
          rm -rf vendor
          composer install --no-interaction --prefer-dist --no-progress

      - name: Report Composer dependency advisories
        continue-on-error: true
        run: composer audit --locked --no-dev

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Verify data commands are registered
        run: |
          php artisan list --raw | grep -q '^data:periods '
          php artisan list --raw | grep -q '^data:coverage '

      - name: Run DSA production guard tests
        run: |
          php artisan test --filter DsaTablesTest
          php artisan test --filter SnapshotServiceUuidTest

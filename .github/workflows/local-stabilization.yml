name: Local Stabilization CI

on:
  push:
    branches:
      - fix/local-mac-stabilization
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare local env files
        run: |
          cp backend/.env.example backend/.env
          cp frontend/.env.example frontend/.env.local

      - name: Validate Docker Compose
        run: docker compose --env-file backend/.env config >/dev/null

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, pdo_mysql, zip, gd
          tools: composer:v2
          coverage: none

      - name: Validate Composer metadata
        working-directory: backend
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        working-directory: backend
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Laravel boots
        working-directory: backend
        run: php artisan --version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:1111/api
          NEXT_PUBLIC_CHAT_URL: http://localhost:1111/chatbot
          NEXT_PUBLIC_DEV_MODE: "1"
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python sources
        run: python -m compileall -q backend/python_engine/app backend/python_engine/config

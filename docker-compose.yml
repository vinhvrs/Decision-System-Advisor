services:
  # MySQL - Limit RAM for Pi 4
  db:
    image: mysql:8.0
    container_name: dsa-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dsa
    ports:
      - "3307:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    command: --innodb_buffer_pool_size=512M --performance_schema=OFF
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Search Engine
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: dsa-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"

  # Vector Database for AI
  qdrant:
    image: qdrant/qdrant:latest
    container_name: dsa-qdrant
    restart: unless-stopped
    volumes:
      - qdrantdata:/qdrant/storage
    ports:
      - "6333:6333"

  # Python Data Engine (Process news, analyze, embed)
  # One-off candle backfill (from repo root): docker compose run --rm data-engine python3 -m app.data_collect.collectors.stock_sync --days 30
  # If backend/.env uses DB_HOST=db (API hits MySQL in Compose), add: -e DB_HOST_PYTHON=db
  # If .env uses host.docker.internal (DB on host), omit DB_HOST_PYTHON so pymysql matches Laravel.
  data-engine:
    build:
      context: ./backend/python_engine
      dockerfile: Dockerfile
    container_name: dsa-data-engine
    restart: unless-stopped
    volumes:
      - ./backend/python_engine:/app
      - ./backend/.env:/app/.env
      # - python_model_cache:/root/.cache
    depends_on:
      - db
      - qdrant
    ports:
      - "8000:8000"
    #volumes:
    #  - ./backend/python_engine:/app
    #  - ./backend/.env:/.env      # Attach .env file to root (/) of container so Python code can find it
    environment:
      - PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
      - TZ=Asia/Ho_Chi_Minh
      - PYTHONUNBUFFERED=1
      # Background jobs (see backend/python_engine/app/main.py APScheduler + FastAPI lifespan):
      # News ingest + embed + Qdrant run here; Laravel news:* schedules are disabled.
      # - NEWS_INTERVAL_HOURS: GDELT → knowledge_docs (default 1h).
      # - NEWS_EMBED_*: embed unprocessed docs → chunks + Qdrant (replaces Artisan embed/qdrant).
      # - SCHEDULE_INTERVAL_HOURS: stock candle sync + auto_analyze share this interval.
      # - backend/.env must include REDIS_* for Laravel + engine. Python needs REDIS_USERNAME for Redis Cloud ACL
      #   (same as Laravel) or AUTH fails silently and dashboard:daily never appears.
      # - DASHBOARD_WARM_UP_BOOTSTRAP_SEC: seconds after startup for first warm-up (default 120).
      - SCHEDULE_INTERVAL_HOURS=3
      # GDELT: add NEWS_HANDLE_ENABLED=1 to backend/.env for scheduled + CLI backfill (rate limits / outbound HTTPS).
      # One-shot history: docker compose run --rm -e NEWS_HANDLE_ENABLED=1 data-engine python3 news_ingest.py backfill --limit-year 2018
      # Rolling window: docker compose run --rm -e NEWS_HANDLE_ENABLED=1 data-engine python3 news_ingest.py daily --lookback-days 14
      - NEWS_INTERVAL_HOURS=1
      - NEWS_EMBED_ENABLED=0
      - NEWS_EMBED_INTERVAL_HOURS=1
      - NEWS_EMBED_BATCH_LIMIT=50
      - NEWS_SCHEDULE_LOOKBACK_DAYS=14
      # SEC EDGAR fundamentals (10 US tech symbols) + optional MacroTrends gap-fill
      - TECH_UNIVERSE_DAILY_ENABLED=1
      - TECH_UNIVERSE_DAILY_INTERVAL_HOURS=24
      - TECH_UNIVERSE_BOOTSTRAP_DELAY_SEC=180
      - TECH_UNIVERSE_YF_PERIOD=30d
      - FUNDAMENTAL_INGEST_ENABLED=1
      - MACROTRENDS_ENABLED=1
      # Table mode: set DEV_MODE in backend/.env (dev → *_demo tables, production → prod tables)
      # Thesis demo default in app/main.py is top_snapshot + 20; for full universe set SYMBOL_INGEST_MODE=all
      - SYMBOL_INGEST_MODE=top_snapshot
      - SYMBOL_INGEST_TOP_N=20
      - SCHEDULER_MISFIRE_GRACE_SEC=14400
      # ARM-only (Pi / Apple Silicon). Omit on amd64 Docker Desktop to avoid missing libgomp preload.
      # - LD_PRELOAD=/usr/lib/aarch64-linux-gnu/libgomp.so.1
      # - OPENBLAS_CORETYPE=ARMV8
    env_file:
      - ./backend/.env            # Pump environment variables directly into container
    #depends_on:                   # Wait for DB and Elastic to run before running Python
    #  mysql:
    #    condition: service_healthy
    #  elasticsearch:
    #    condition: service_healthy
    command: python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8000

  # Laravel API
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dsa-api
    restart: unless-stopped
    volumes:
      - ./backend:/var/www
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD-SHELL", "pidof php-fpm >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Web Server
  nginx:
    image: nginx:alpine
    container_name: dsa-nginx
    restart: unless-stopped
    ports:
      - "1111:80"
    volumes:
      - ./backend:/var/www
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      app:
        condition: service_healthy

volumes:
  mysqldata:
  esdata:
  qdrantdata:
  # python_model_cache:
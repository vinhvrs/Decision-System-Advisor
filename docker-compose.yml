name: dsa-local

services:
  db:
    image: mysql:8.0
    container_name: dsa-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-dsa}
      MYSQL_USER: ${DB_USERNAME:-dsa_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-dsa_password}
      TZ: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    command:
      - --innodb-buffer-pool-size=512M
      - --performance-schema=OFF
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: dsa-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: dsa-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: dsa-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  data-engine:
    build:
      context: ./backend/python_engine
      dockerfile: Dockerfile
    container_name: dsa-data-engine
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ELASTIC_HOST: http://elasticsearch:9200
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_URL: http://127.0.0.1:8000
      TZ: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      PYTHONUNBUFFERED: "1"
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      SCHEDULE_INTERVAL_HOURS: ${SCHEDULE_INTERVAL_HOURS:-3}
      NEWS_INTERVAL_HOURS: ${NEWS_INTERVAL_HOURS:-1}
      NEWS_EMBED_ENABLED: ${NEWS_EMBED_ENABLED:-0}
      NEWS_EMBED_INTERVAL_HOURS: ${NEWS_EMBED_INTERVAL_HOURS:-1}
      NEWS_EMBED_BATCH_LIMIT: ${NEWS_EMBED_BATCH_LIMIT:-50}
      NEWS_SCHEDULE_LOOKBACK_DAYS: ${NEWS_SCHEDULE_LOOKBACK_DAYS:-14}
      SYMBOL_INGEST_MODE: ${SYMBOL_INGEST_MODE:-top_snapshot}
      SYMBOL_INGEST_TOP_N: ${SYMBOL_INGEST_TOP_N:-20}
      SCHEDULER_MISFIRE_GRACE_SEC: ${SCHEDULER_MISFIRE_GRACE_SEC:-14400}
    volumes:
      - ./backend/python_engine:/app
      - python_model_cache:/root/.cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_started
      qdrant:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    command: python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8000

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dsa-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ELASTIC_HOST: http://elasticsearch:9200
      EMBEDDING_SERVICE_URL: http://data-engine:8000
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: dsa-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:1111:80"
    volumes:
      - ./backend:/var/www
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  mysqldata:
  esdata:
  qdrantdata:
  backend_vendor:
  python_model_cache:

services:
  # MySQL - Giới hạn RAM cho Pi 4
  db:
    image: mysql:8.0
    container_name: dsa-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dsa
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    command: --innodb_buffer_pool_size=512M --performance_schema=OFF
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  # Search Engine
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: dsa-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"

  # Vector Database cho AI
  qdrant:
    image: qdrant/qdrant:latest
    container_name: dsa-qdrant
    volumes:
      - qdrantdata:/qdrant/storage
    ports:
      - "6333:6333"

  # Python Data Engine (Xử lý tin tức, phân tích, embedding)
  data-engine:
    build:
      context: ./backend/python_engine
      dockerfile: Dockerfile
    container_name: dsa-data-engine
    volumes:
      - ./backend/python_engine:/app
      - ./backend/.env:/app/.env
      - python_model_cache:/root/.cache
    depends_on:
      - db
      - qdrant
    ports:
      - "8000:8000"
    volumes:
      - ./backend/python_engine:/app
      - ./backend/.env:/.env      # Gắn file .env vào thư mục root (/) của container để code Python tìm thấy
    env_file:
      - ./backend/.env            # Bơm biến môi trường trực tiếp vào container
    depends_on:                   # Đợi DB và Elastic chạy xong mới chạy Python
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  # Laravel API
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dsa-api
    volumes:
      - ./backend:/var/www
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env

  # Web Server
  nginx:
    image: nginx:alpine
    container_name: dsa-nginx
    ports:
      - "1111:80"
    volumes:
      - ./backend:/var/www
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

volumes:
  mysqldata:
  esdata:
  qdrantdata:
  python_model_cache:

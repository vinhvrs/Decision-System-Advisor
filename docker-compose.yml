services:
  # ================================
  # MySQL - Main Database
  # ================================
  mysql:
    image: mysql:8.0
    container_name: dsa-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dsa
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      TZ: UTC
    ports:
      - "3307:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ================================
  # Elasticsearch
  # ================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: dsa-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ================================
  # Kibana
  # ================================
  # kibana:
  #   image: docker.elastic.co/kibana/kibana:8.15.0
  #   container_name: dsa-kibana
  #   restart: unless-stopped
  #   environment:
  #     - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
  #   ports:
  #     - "5601:5601"
  #   depends_on:
  #     elasticsearch:
  #       condition: service_healthy
        
  # ================================
  # Qdrant - Vector DB
  # ================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: dsa-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  # ================================
  # Python Service (FastAPI)
  # ================================
  data-engine:
    build:
      context: ./backend/python_engine
      dockerfile: Dockerfile
    container_name: dsa-data-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/python_engine:/app
      - ./backend/.env:/.env      # Gắn file .env vào thư mục root (/) của container để code Python tìm thấy
    env_file:
      - ./backend/.env            # Bơm biến môi trường trực tiếp vào container
    depends_on:                   # Đợi DB và Elastic chạy xong mới chạy Python
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  # ================================
  # Laravel API (PHP-FPM)
  # ================================
  app:
    build:
      context: .
      dockerfile: /backend/Dockerfile
    container_name: dsa-api
    restart: unless-stopped
    volumes:
      - .:/var/www
    env_file:
      - /backend/.env
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  # ================================
  # Nginx - Public HTTP
  # ================================
  nginx:
    image: nginx:alpine
    container_name: dsa-nginx
    restart: unless-stopped
    ports:
      - "1111:80"
    volumes:
      - .:/var/www
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

# ================================
# Volumes
# ================================
volumes:
  mysqldata:
  esdata:
  qdrantdata: